<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-1TAnSPUnPNMSq9HxlEiHkG5CpgGcM6mTCnYvLy4v1/0='; style-src 'sha256-rG8GGiozdOuYEpmDcyGhBTGU6KEd/sqG6ScvaYCSBJI='; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Authorization code</title>
<style>
body { font: 16px/1.5 -apple-system, system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #111; }
#code { display: block; padding: 1rem; background: #f2f2f2; border-radius: 8px; word-break: break-all; font: 15px ui-monospace, Menlo, monospace; user-select: all; }
button { margin-top: 1rem; padding: .6rem 1.2rem; font-size: 16px; }
</style>
</head>
<body>
<h1>Authorization code</h1>
<code id="code">Reading the link…</code>
<button id="copy" type="button">Copy</button>
<p id="msg" aria-live="polite"></p>
<script>
(function () {
  var q = new URLSearchParams(window.location.search);
  var code = q.get("auth_code") || q.get("code") || "";
  var el = document.getElementById("code");
  var btn = document.getElementById("copy");
  var msg = document.getElementById("msg");
  if (!code) {
    el.textContent = "No auth_code in this link.";
    btn.hidden = true;
    return;
  }
  el.textContent = code;
  btn.addEventListener("click", function () {
    var done = function () { msg.textContent = "Copied."; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, function () {
        msg.textContent = "Copy failed: select the code and copy it by hand.";
      });
    } else {
      var r = document.createRange();
      r.selectNodeContents(el);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      document.execCommand("copy");
      done();
    }
  });
})();
</script>
</body>
</html>
